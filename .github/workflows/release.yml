name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@latest

      - name: Resolve release metadata
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (typeof version !== 'string') throw new Error('Missing package version');
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Git tag must match package.json version v${version}`);
          }

          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(version);
          if (!match || match[0] !== version) throw new Error(`Invalid version: ${version}`);

          const prerelease = match[4];
          if (prerelease?.split('.').some((part) => /^0\d+$/.test(part))) {
            throw new Error(`Numeric prerelease identifiers must not have leading zeros: ${version}`);
          }
          const distTag = prerelease ? prerelease.split('.')[0] : 'latest';
          if (prerelease && (
            !/^[a-z][a-z0-9-]*$/.test(distTag) ||
            distTag === 'latest' || distTag === 'x' || /^v\d+$/.test(distTag)
          )) {
            throw new Error(`Use a named prerelease channel such as beta or rc: ${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT,
            `dist-tag=${distTag}\nprerelease=${Boolean(prerelease)}\n`);
          console.log(`Version: ${version}; npm tag: ${distTag}; prerelease: ${Boolean(prerelease)}`);
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting and lint
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Typecheck, build and pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/wspie-package"

      - name: Smoke test the package
        run: |
          npm install --prefix "$RUNNER_TEMP/wspie-smoke" --ignore-scripts --no-package-lock "$RUNNER_TEMP/wspie-package/"*.tgz
          expected_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          cd "$RUNNER_TEMP/wspie-smoke"
          for command in ws wspie; do
            "./node_modules/.bin/$command" --help
            actual_version=$("./node_modules/.bin/$command" --version)
            test "$actual_version" = "$expected_version"
          done

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP/wspie-package/"*.tgz --access public --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
